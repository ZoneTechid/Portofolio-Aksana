    <pattern id="hex" width="40" height="34.64" patternUnits="userSpaceOnUse" patternTransform="scale(1.2)">
  <polygon points="20,0 40,11.55 40,23.09 20,34.64 0,23.09 0,11.55" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.18"/>
</pattern>
  </defs>
  <rect width="800" height="560" rx="20" fill="url(#abg)"/>
  <rect width="800" height="560" rx="20" fill="url(#hex)"/>
  <circle cx="400" cy="280" r="210" fill="#F59E0B" opacity="0.18"/>
  <!-- Honeycomb Behind Jar -->
  <g transform="translate(150,110)" opacity="0.85">
