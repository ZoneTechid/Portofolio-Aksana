    <text x="110" y="165" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="16" fill="#1E4D47">MADU NUSANTARA</text>
    <text x="110" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#B45309">100% RAW HONEY</text>
    <line x1="65" y1="204" x2="155" y2="204" stroke="#D97706" stroke-width="1.5"/>
    <text x="110" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#298A81">PURE &amp; UNFILTERED</text>
